<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Portal</title>
<meta name="theme-color" content="#9570cf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kaiya">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/kaiya-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fredoka:wght@400;500;600;700&family=Figtree:wght@400;500;600;700;800&family=Caprasimo&display=swap">
<style>
:root{
  --bg:#d9eeff; --paper:#ffffff; --ink:#22304a; --muted:#5b6b86;
  --grape:#6b4eff; --sun:#ffc93c; --leaf:#2dbe60; --leaf-soft:#d7f5e1; --coral:#ff6b5a; --line:#b9d8f0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#16233b;--paper:#22314f;--ink:#f3f6ff;--muted:#a9b7d3;--leaf-soft:#1d4a37;--line:#35507a}
}
:root[data-theme="dark"]{--bg:#16233b;--paper:#22314f;--ink:#f3f6ff;--muted:#a9b7d3;--leaf-soft:#1d4a37;--line:#35507a}

/* grown-up palette */
body[data-mode="adult"]{--bg:#f1f3f6;--paper:#ffffff;--ink:#1d2433;--muted:#667085;--line:#dfe3ea;--grape:#2f5d7c;--leaf:#2f855a;--leaf-soft:#e4f2ea;
  font-family:"DM Sans","Helvetica Neue",Arial,system-ui,sans-serif}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) body[data-mode="adult"]{--bg:#0f1624;--paper:#182234;--ink:#eef2f8;--muted:#9aa7bd;--line:#2a364d;--leaf-soft:#173a2b;--grape:#4c86ad}
}
:root[data-theme="dark"] body[data-mode="adult"]{--bg:#0f1624;--paper:#182234;--ink:#eef2f8;--muted:#9aa7bd;--line:#2a364d;--leaf-soft:#173a2b;--grape:#4c86ad}

html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Fredoka","Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#fp-app{max-width:1100px;margin:0 auto;padding:16px 18px 40px}
svg.av{display:block}

/* top bar */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.people{display:flex;gap:10px;flex:1}
.person{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px 8px;
  border:4px solid transparent;border-radius:26px;background:var(--paper);font-weight:600;font-size:18px}
.person .face{display:block;line-height:0}
.person[aria-pressed="true"]{border-color:var(--grape);background:var(--grape);color:#fff}
body[data-mode="adult"] .person{flex-direction:row;justify-content:center;gap:10px;border-width:2px;border-radius:14px;padding:8px 10px;font-size:16px;border-color:var(--line)}
body[data-mode="adult"] .person[aria-pressed="true"]{border-color:var(--grape)}
.gear{width:52px;height:52px;flex:0 0 auto;border-radius:50%;border:none;background:var(--paper);font-size:24px;opacity:.75;position:relative;overflow:hidden}
.gear::after{content:"";position:absolute;inset:0;background:var(--grape);opacity:.25;transform:scaleX(0);transform-origin:left}
.gear.holding::after{transform:scaleX(1);transition:transform 1.1s linear}

/* date line */
.dayline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 2px 16px}
.dayline h1{margin:0;font-size:clamp(30px,5vw,46px);font-weight:700;line-height:1.05}
.dayline .sub{color:var(--muted);font-size:18px;font-weight:500}
.sync-alert{background:#fff4ce;border:2px solid #d49b00;color:#5b3c00;border-radius:14px;padding:10px 14px;margin:0 0 14px;font:600 14px "DM Sans",system-ui,sans-serif}
.kid-week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin:0 0 18px}
.kid-day{border:3px solid var(--line);border-radius:18px;background:var(--paper);padding:8px 3px;text-align:center;font-weight:600;color:var(--muted)}
.kid-day b{display:block;font-size:22px;color:var(--ink)}.kid-day span{display:block;min-height:24px;font-size:18px;white-space:nowrap;overflow:hidden}
.kid-day[aria-current="true"]{background:var(--grape);border-color:var(--grape);color:#fff;transform:translateY(-2px)}.kid-day[aria-current="true"] b{color:#fff}
@media(max-width:560px){.kid-week{gap:4px}.kid-day{border-width:2px;border-radius:14px;padding:7px 1px;font-size:11px}.kid-day b{font-size:18px}.kid-day span{font-size:15px}}
.reward-card{background:linear-gradient(135deg,#6b4eff,#8e72ff);color:#fff;border-radius:28px;padding:16px 18px;margin:0 0 20px;display:grid;grid-template-columns:auto 1fr;gap:12px 16px;align-items:center}
.reward-star{font-size:58px;line-height:1}.reward-card h2{margin:0;font-size:23px}.reward-card p{margin:2px 0 0;font-size:17px}.reward-track{grid-column:1/-1;height:14px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden}.reward-track i{display:block;height:100%;border-radius:99px;background:var(--sun)}
.reward-card.won{background:linear-gradient(135deg,#16a34a,#2dbe60);animation:pop .45s ease-out}.reward-card.won .reward-star{font-size:68px}
.reward-card.locked .reward-star{filter:grayscale(.25)}
.bonus-card{background:#fff7d7;border:2px solid #efd36d;border-radius:28px;padding:18px;margin:0 0 20px}.bonus-card h2{margin:0 0 4px}.bonus-card>p{margin:0 0 12px;color:var(--muted);font-weight:600}.bonus-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.bonus-task{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;border:2px solid #ead58b;background:var(--paper);border-radius:20px;padding:12px;text-align:left}.bonus-task .pic{font-size:34px}.bonus-task strong{display:block;font-size:18px}.bonus-task b{color:#8b6512;white-space:nowrap}.bonus-task.done{background:var(--leaf-soft);border-color:var(--leaf);opacity:.75}
.nav{display:flex;gap:8px}
.nav button{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 16px;font-weight:500;font-size:16px}

/* ---- Kaiya ---- */
.card-k{background:var(--paper);border-radius:32px;padding:16px 18px 18px;margin-bottom:22px}
.card-k h2{margin:0 0 10px;font-size:22px;font-weight:600;color:var(--muted)}
.ci-say{font-size:clamp(24px,4vw,32px);font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.ci-pick{background:var(--bg);border-radius:18px;padding:4px 16px;min-width:64px;text-align:center}
.ci-pick.fixed{background:var(--grape);color:#fff}
.ci-row+.ci-row{margin-top:8px;padding-top:8px;border-top:3px dotted var(--line)}
.emos{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.emo{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;border-radius:22px;border:5px solid var(--line);background:var(--paper);font-size:18px;font-weight:600}
.emo .e{font-size:50px;line-height:1.1}
.emo[aria-pressed="true"]{border-color:var(--grape);background:var(--bg)}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.dchip{padding:14px 6px;border-radius:20px;border:5px solid var(--line);background:var(--paper);font-size:21px;font-weight:600}
.dchip[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.dchip.shake{animation:wig .5s}
@keyframes wig{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.hint{font-size:22px;font-weight:600;color:var(--coral);margin:8px 0 0}
.mini-say{border:none;background:var(--bg);border-radius:50%;width:46px;height:46px;font-size:22px}

.strip{display:flex;align-items:stretch;gap:6px;overflow-x:auto;padding-bottom:4px}
.step{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  min-width:160px;padding:12px 16px;border-radius:24px;background:var(--bg);text-align:center}
.step .pic{font-size:68px;line-height:1}
.step .lbl{font-size:21px;font-weight:600}
.step .when{font-size:28px}
.arrow{flex:0 0 auto;align-self:center;font-size:34px;color:var(--grape);font-weight:700}
.tmrw{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:3px dotted var(--line);font-size:20px;font-weight:600;color:var(--muted)}
.tmrw .c{background:var(--bg);border-radius:16px;padding:4px 14px;color:var(--ink)}

.ghead{display:flex;align-items:center;gap:10px;margin:8px 4px 10px;font-size:26px;font-weight:600}
.ghead .gi{font-size:42px;line-height:1}
.ghead-btn{width:100%;justify-content:space-between;border:0;background:transparent;text-align:left;padding:4px 6px}
.ghead-title{display:flex;align-items:center;gap:10px}
.ghead-meta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:18px}
.ghead-btn .chev{font-size:22px;color:var(--grape);transition:transform .18s ease}
.ghead-btn[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.stars{display:flex;gap:6px;font-size:36px;margin:0 0 14px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tw,210px),1fr));gap:14px;margin-bottom:18px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  min-height:var(--th,230px);padding:16px 10px 14px;border-radius:30px;border:6px solid var(--sun);background:var(--paper);
  box-shadow:0 8px 0 rgba(34,48,74,.14);transition:transform .12s, box-shadow .12s, background .2s, border-color .2s}
.tile:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(34,48,74,.14)}
.tile .pic{font-size:var(--pic,96px);line-height:1}
.tile .name{font-size:var(--nm,24px);font-weight:600;text-align:center;line-height:1.1}
.tile .box{position:absolute;top:10px;right:12px;width:46px;height:46px;border-radius:50%;border:5px solid var(--line);background:var(--paper);display:grid;place-items:center;font-size:28px;color:#fff}
.tile.done{background:var(--leaf-soft);border-color:var(--leaf)}
.tile.done .pic,.tile.done .name{opacity:.55}
.tile.done .box{background:var(--leaf);border-color:var(--leaf)}
.tile.done .box::after{content:"\2713";font-weight:700}
.tile.done.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.92)}55%{transform:scale(1.06)}100%{transform:scale(1)}}
.speak{position:absolute;bottom:8px;right:10px;background:transparent;font-size:24px;opacity:.55;padding:6px}
.dens-xl{--tw:240px;--th:280px;--pic:120px;--nm:28px}
.dens-l{--tw:170px;--th:205px;--pic:86px;--nm:22px}
.dens-m{--tw:138px;--th:168px;--pic:68px;--nm:19px}
.dens-s{--tw:118px;--th:142px;--pic:54px;--nm:17px}
.dens-m .tile,.dens-s .tile{border-width:5px;border-radius:24px}
.dens-m .tile .box,.dens-s .tile .box{width:32px;height:32px;border-width:4px;font-size:20px;top:8px;right:8px}
.dens-m .speak,.dens-s .speak{font-size:18px;bottom:4px;right:6px}
.groups.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;align-items:start}
.gcard{background:var(--paper);border-radius:30px;padding:12px 12px 2px}
.gcard .grid{margin-bottom:12px}
.groups.cols .tile:not(.done){background:var(--bg)}
.groups:not(.cols) .gcard{background:transparent;padding:0}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:16px;margin-bottom:22px;align-items:start}
.pair .card-k{margin-bottom:0}
.ci-compact{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;font-size:24px;font-weight:600}
.ci-compact .ci-pick{font-size:24px}
.ci-compact .btn{margin-left:auto;font-family:"DM Sans",system-ui,sans-serif}
.cheer{background:var(--leaf);color:#fff;border-radius:30px;padding:18px;text-align:center;font-size:32px;font-weight:700;margin-bottom:18px}
.cheer .big{font-size:60px;display:block;line-height:1.1}
@media (prefers-reduced-motion:no-preference){.cheer .big{animation:pop .7s ease-out}}
@media (prefers-reduced-motion:reduce){.tile,.tile.done.pop,.dchip.shake{animation:none;transition:none}}
.empty{background:var(--paper);border-radius:28px;padding:34px;text-align:center;font-size:26px;font-weight:600}
.empty .big{font-size:80px;display:block}
.daily-fun{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;margin-bottom:20px}
.fun-card{background:var(--paper);border-radius:30px;padding:18px}
.fun-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.fun-head h2{margin:0;font-size:24px}
.letter-launch{width:100%;border:4px solid var(--grape);border-radius:24px;background:var(--bg);padding:14px;display:flex;align-items:center;gap:16px;text-align:left}
.letter-badge{display:flex;align-items:baseline;justify-content:center;gap:3px;flex:0 0 auto;width:100px;height:90px;border-radius:24px;background:var(--grape);color:#fff;font-size:55px;font-weight:700}
.letter-badge small{font-size:37px;color:#fff}
.letter-launch strong{display:block;font-size:25px}.letter-launch small{display:block;color:var(--muted);font-size:17px;margin-top:3px}
.lesson{margin-top:12px;border:3px dashed var(--line);border-radius:22px;padding:14px;text-align:center}
.lesson-word{font-size:29px;font-weight:600;margin:4px 0 10px}.lesson-word .big{font-size:55px;display:block}
.sound-btn{border:0;border-radius:16px;background:var(--grape);color:#fff;padding:11px 18px;font-size:18px;font-weight:600}
.letter-game{margin-top:14px;padding-top:12px;border-top:2px dotted var(--line)}
.letter-game p{font-size:18px;font-weight:600;margin:0 0 9px}
.letter-choices{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
.letter-choice{border:3px solid var(--line);border-radius:18px;background:var(--paper);padding:9px 13px;font-size:26px}
.letter-choice.selected{border-color:var(--grape);background:var(--bg);transform:translateY(-2px)}
.letter-choice.right{border-color:var(--leaf);background:var(--leaf-soft)}
.letter-choice.wrong{border-color:var(--coral);background:#fff0ee}
.letter-submit{margin-top:10px;border:0;border-radius:15px;background:var(--grape);color:#fff;padding:10px 24px;font-size:18px;font-weight:600}
.letter-submit:disabled{opacity:.4;cursor:not-allowed}
.letter-feedback{min-height:25px;margin:8px 0 0;font-size:18px;font-weight:600;color:var(--grape)}
.workout-list{display:grid;gap:9px}
.move{width:100%;display:flex;align-items:center;gap:12px;border:3px solid var(--line);border-radius:18px;background:var(--bg);padding:10px 12px;text-align:left}
.move .move-emoji{font-size:38px}.move strong{display:block;font-size:18px}.move small{color:var(--muted);font-size:15px}
.move .move-check{margin-left:auto;width:34px;height:34px;border:4px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:22px;color:#fff}
.move.done{background:var(--leaf-soft);border-color:var(--leaf)}.move.done .move-check{background:var(--leaf);border-color:var(--leaf)}.move.done .move-check::after{content:"\2713"}
.workout-cheer{text-align:center;color:var(--leaf);font-size:20px;font-weight:700;margin:10px 0 0}
.discovery-card{background:linear-gradient(160deg,var(--paper),var(--bg));border:3px solid var(--sun)}
.discovery-theme{display:inline-block;background:var(--sun);color:#483412;border-radius:999px;padding:5px 11px;font-size:15px;font-weight:700;margin-bottom:12px}
.discovery-surprise{width:100%;border:3px dashed var(--grape);border-radius:22px;background:var(--paper);padding:18px;font-size:21px;font-weight:600;text-align:center}
.discovery-surprise .big{display:block;font-size:58px;margin-bottom:4px}
.discovery-content{font-size:20px;line-height:1.35}.discovery-content .big{font-size:58px;display:block;text-align:center}
.discovery-content strong{display:block;font-size:23px;margin:6px 0 8px}
.discovery-try{background:var(--paper);border-radius:18px;padding:10px 13px;margin:12px 0;font-size:18px}
.discovery-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---- grown-up ---- */
.a-wrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:18px;align-items:start}
@media (max-width:820px){.a-wrap{grid-template-columns:1fr}}
.a-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px}
.a-card h2{margin:0 0 12px;font-size:15px;font-weight:700;color:var(--muted)}
.a-card:last-child{margin-bottom:0}
.a-prog{display:flex;align-items:center;gap:12px;margin-bottom:6px;font-size:15px;color:var(--muted)}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.a-group{margin-top:14px}
.a-group h3{margin:0 0 2px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;color:var(--ink)}
.a-group h3 span{font-weight:500;color:var(--muted)}
.a-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 2px;background:none;border:0;border-top:1px solid var(--line);text-align:left}
.a-check{flex:0 0 auto;width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;font-size:14px;color:#fff}
.a-row[aria-pressed="true"] .a-check{background:var(--leaf);border-color:var(--leaf)}
.a-row[aria-pressed="true"] .a-check::after{content:"\2713";font-weight:700}
.a-row[aria-pressed="true"] .a-title{text-decoration:line-through;color:var(--muted)}
.a-title{font-size:17px;font-weight:500}
.a-meta{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-of-type{border-top:0;padding-top:0}
.kv span:first-child{color:var(--muted)}.kv span:last-child{text-align:right;font-weight:500}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;background:var(--paper);font-size:12px;color:var(--muted)}
.wd b{display:block;font-size:18px;color:var(--ink);font-weight:700}
.wd[aria-current="true"]{background:var(--grape);border-color:var(--grape);color:#fff}
.wd[aria-current="true"] b{color:#fff}
.up{padding:8px 0;border-top:1px solid var(--line);font-size:15px;display:flex;gap:10px}
.up:first-of-type{border-top:0}
.up span:first-child{color:var(--muted);flex:0 0 78px}
.note{color:var(--muted);font-size:15px;margin:0}
.a-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.a-head h2{margin:0}
.btn.sm{padding:7px 14px;font-size:14px;font-family:"DM Sans",system-ui,sans-serif}
.a-rowwrap{display:flex;align-items:center;border-top:1px solid var(--line)}
.a-rowwrap .a-row{border-top:0;flex:1;min-width:0}
.a-edit{flex:0 0 auto;background:none;border:0;color:var(--grape);font-size:14px;font-weight:500;padding:10px 6px;font-family:"DM Sans",system-ui,sans-serif}
.lock{min-height:80vh;display:grid;place-items:center}
.lock-card{background:var(--paper);border-radius:36px;padding:26px 28px 30px;width:min(360px,100%);text-align:center}
.lock-ico{font-size:56px;line-height:1}
.lock-card h1{margin:6px 0 2px;font-size:30px}
.lock-card p{margin:0 0 14px;color:var(--muted);font-size:18px}
.dots{display:flex;justify-content:center;gap:12px;margin:0 0 16px;min-height:24px}
.dots i{width:20px;height:20px;border-radius:50%;border:3px solid var(--grape)}
.dots i.on{background:var(--grape)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{padding:16px 0;border-radius:20px;border:none;background:var(--bg);font-size:28px;font-weight:600}
.pad button:active{transform:scale(.95)}
.lock-card .hint{margin:12px 0 0}
button:focus-visible{outline:4px solid var(--coral);outline-offset:2px}

/* editor */
.sheet{position:fixed;inset:0;background:rgba(15,25,45,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding-top:env(safe-area-inset-top,0px)}
.sheet .card{background:var(--paper);color:var(--ink);width:min(720px,100%);max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));user-select:text;-webkit-user-select:text;font-family:"DM Sans",system-ui,sans-serif}
.card h3{margin:0 0 12px;font-size:24px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .t{flex:1;font-size:17px}.row .t small{display:block;color:var(--muted);font-size:13px}
.btn{border:none;border-radius:12px;padding:10px 16px;font-weight:600;font-size:16px;background:var(--bg)}
.btn.main{background:var(--grape);color:#fff}.btn.bad{background:var(--coral);color:#fff}
.form label{display:block;margin:12px 0 4px;font-weight:600;color:var(--muted);font-size:14px}
.form input[type=text],.form input[type=date],.form select{width:100%;font:inherit;font-size:17px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--grape);border-color:var(--grape);color:#fff}
.msg{margin:10px 0 0;color:var(--muted);font-size:14px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
/* Warm, playful layout from the new Kaiya mockup. */
body[data-mode="kid"]{--bg:#f5ead8;--paper:#fffaf1;--ink:#29241f;--muted:#72675d;--grape:#9570cf;--sun:#f5cc6d;--leaf:#7a8a5e;--leaf-soft:#e9f0d9;--coral:#ce7464;--line:#e7d9c9;font-family:"Figtree",system-ui,sans-serif}
body[data-mode="kid"] h1,body[data-mode="kid"] h2,body[data-mode="kid"] .ghead-title{font-family:"Caprasimo","Fredoka",sans-serif;font-weight:400}
body[data-mode="kid"] .person,body[data-mode="kid"] .gear,body[data-mode="kid"] .card-k,body[data-mode="kid"] .fun-card,body[data-mode="kid"] .gcard{box-shadow:0 7px 24px rgba(91,65,44,.07)}
body[data-mode="kid"] .person{border-width:2px;border-color:var(--line);font-size:15px;border-radius:22px}
body[data-mode="kid"] .person{flex-direction:row;justify-content:center;gap:6px;padding:7px 8px}body[data-mode="kid"] .person .face svg{width:35px;height:35px}
body[data-mode="kid"] .person[aria-pressed="true"]{border-color:var(--grape)}
body[data-mode="kid"] .dayline h1{font-size:clamp(34px,6vw,58px)}
body[data-mode="kid"] .card-k,body[data-mode="kid"] .fun-card{border:1px solid var(--line)}
body[data-mode="kid"] .reward-card{background:#e9ddf7;color:var(--ink);border:1px solid #d9c3f1;box-shadow:0 7px 24px rgba(91,65,44,.07)}
body[data-mode="kid"] .reward-track{background:#d5c1ea}
body[data-mode="kid"] .kid-day[aria-current="true"]{background:var(--grape);color:white}
body[data-mode="kid"] .tile{border-color:#e6c88f;box-shadow:0 5px 0 #d9c6a9}
.week-details{margin-bottom:16px}.week-details summary{cursor:pointer;font-weight:800;color:var(--muted);padding:8px 2px}.week-details .kid-week{margin-top:10px}.all-jobs-toggle{width:100%;border:2px solid var(--line);background:var(--paper);border-radius:20px;padding:14px;font-weight:800;font-size:18px;margin:0 0 16px}
.section-head{margin:28px 2px 12px;font-size:24px;line-height:1.15}.section-head small{display:block;font:600 15px "Figtree",sans-serif;color:var(--muted);margin-top:3px}
.activity-grid,.day-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:18px;align-items:stretch}.activity-grid .card-k,.activity-grid .fun-card,.day-grid .card-k,.day-grid .reward-card{margin:0;min-width:0}.day-grid{grid-template-columns:minmax(0,1.5fr) minmax(260px,.8fr)}.day-grid .strip{max-width:100%}
.up-next{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 18px;padding:12px 16px;background:var(--paper);border:1px solid var(--line);border-radius:20px}.up-next strong{color:var(--muted);margin-right:4px}.up-next span{padding:7px 11px;border-radius:99px;background:var(--bg);font-weight:700}
.job-hero{display:grid;grid-template-columns:auto 1fr;gap:12px 18px;align-items:center;background:#e9ddf7;border:1px solid #d9c3f1;border-radius:30px;padding:22px;margin:0 0 18px}.job-hero .hero-pic{font-size:72px;line-height:1}.job-hero h2{margin:2px 0;font-size:clamp(28px,5vw,42px)}.job-hero .hero-label{font-weight:800;color:#6b4a9c;text-transform:uppercase;letter-spacing:.09em}.hero-actions{grid-column:1/-1;display:flex;gap:10px}.hero-actions button{flex:1;border:0;border-radius:18px;padding:14px;font-size:20px;font-weight:800;background:var(--paper)}.hero-actions button:last-child{background:var(--leaf);color:#fff}

    for(var n=1;n<=9;n++)h+='<button data-pin="'+n+'" aria-label="'+n+'">'+n+'</button>';
    h+='<button data-pin="clear" aria-label="Clear">✕</button><button data-pin="0" aria-label="0">0</button><button data-pin="back" aria-label="Delete">⌫</button></div>';
    if(pinBad)h+='<p class="hint">Wrong PIN. Try again.</p>';
    app.innerHTML=h+'</div></div>';
  }
  function pinKey(k){
    if(k==="clear")pinEntry="";else if(k==="back")pinEntry=pinEntry.slice(0,-1);else pinEntry+=k;
    pinBad=false;
    if(pinEntry.length>=state.pin.length){
      if(pinEntry===state.pin){unlocked=true;sessionStorage.setItem("fp-unlock",state.pin);pinEntry="";render();return}
      pinBad=true;pinEntry="";
    }
    renderLock();
  }
  function render(){
    if(!unlocked){renderLock();return}
    var d=viewDate(), kid=(who==="daughter");
    document.body.setAttribute("data-mode",kid?"kid":"adult");
    var h='<div class="top"><div class="people">';
    PEOPLE.forEach(function(p){h+='<button class="person" data-who="'+p.id+'" aria-pressed="'+(p.id===who)+'"><span class="face">'+avatar(p.id,kid?60:36)+'</span>'+p.name+'</button>'});
    h+='</div><button class="gear" id="gear" aria-label="Grown-up settings (press and hold)">⚙️</button></div>';
    if(syncMessage)h+='<div class="sync-alert" role="status">'+esc(syncMessage)+'</div>';
    if(completionError)h+='<div class="sync-alert" role="status">'+esc(completionError)+'</div>';
    h+=kid?kidView(d):adultView(d);
    if(sheetOpen)h+=sheet();
    app.innerHTML=h;
    justDone=null;shakeIdx=null;
  }

  /* ---------- editor ---------- */
  function sheet(){
    var h='<div class="sheet" id="sheet"><div class="card">';
    if(editing){
      var it=editing, r=it.repeat||{kind:"daily"};
      h+='<h3>'+(it._new?"Add something":"Edit")+'</h3><div class="form">';
      h+='<label>Picture or emoji</label><input type="text" id="f-emoji" maxlength="12" value="'+esc(it.emoji)+'">';
      h+='<label>Name</label><input type="text" id="f-title" value="'+esc(it.title)+'">';
      h+='<label>Who</label><select id="f-who">';
      PEOPLE.forEach(function(p){h+='<option value="'+p.id+'"'+(((it.who||[])[0]||who)===p.id?' selected':'')+'>'+p.name+'</option>'});
      h+='</select><label>Goes on</label><select id="f-type"><option value="task"'+(it.type!=="plan"?' selected':'')+'>Tasks — can be checked off</option><option value="plan"'+(it.type==="plan"?' selected':'')+'>Calendar / My Day</option></select>';
      if(it.type!=="plan")h+='<label>Stars (use 2 or more for a bonus task)</label><input type="text" id="f-stars" inputmode="numeric" value="'+starValue(it)+'">';
      h+='<label>One-time or recurring?</label><select id="f-kind"><option value="daily"'+(r.kind==="daily"?" selected":"")+'>Recurring — every day</option><option value="days"'+(r.kind==="days"?" selected":"")+'>Recurring — selected weekdays</option><option value="date"'+(r.kind==="date"?" selected":"")+'>One-time — selected date</option></select>';
      if(r.kind==="days"){h+='<label>Which days</label><div class="chips">';DOW.forEach(function(nm,i){h+='<button class="chip" data-f="day" data-v="'+i+'" aria-pressed="'+((r.days||[]).indexOf(i)>-1)+'">'+nm+'</button>'});h+='</div>'}
      if(r.kind==="date")h+='<label>Date</label><input type="date" id="f-date" value="'+esc(r.date||iso(viewDate()))+'">';
      h+='<label>Time of day (choose more than one if needed)</label><div class="chips">';
      SLOTS.forEach(function(s){h+='<button class="chip" data-f="slot" data-v="'+s+'" aria-pressed="'+((it.slots||[]).indexOf(s)>-1)+'">'+s+'</button>'});
      h+='</div></div><div class="actions">'
        +(it._new?'':'<button class="btn bad" data-act="delete">'+(confirmDel?'Tap again to delete':'Delete')+'</button>')
        +'<button class="btn" data-act="cancel-edit">Cancel</button><button class="btn main" data-act="save">Save</button></div>';
    } else {
      h+='<h3>Grown-up settings</h3>';
      h+='<p class="msg" style="margin:0 0 6px">Changes are saved privately in this browser on this device.</p>';
      items().forEach(function(it){
        var names=(it.who||[]).map(function(id){return id==="daughter"?"Kaiya":id==="mom"?"Mom":"Dad"}).join(", ");
        h+='<div class="row"><span style="font-size:28px">'+((it.who||[]).indexOf("daughter")>-1?esc(it.emoji):"")+'</span><div class="t">'+esc(it.title)+'<small>'+(it.type==="plan"?"Schedule":"Task")+(it.type!=="plan"?' · '+starValue(it)+' ⭐':'')+' · '+esc(repeatText(it))+((it.slots&&it.slots.length)?" · "+it.slots.join(" + "):"")+' · '+names+'</small></div>'
          +'<button class="btn" data-act="edit" data-id="'+esc(it.id)+'">Edit</button></div>';
      });
      h+='<div class="form"><label>Portal passcode</label><p class="msg">The passcode is 123. It stays locked until entered in each browser session.</p></div>';
      h+='<div class="form"><label>Stars needed to unlock Friday’s surprise</label><input type="text" id="f-reward-goal" inputmode="numeric" value="'+reward.goal+'"><label>Friday surprise</label><input type="text" id="f-reward-prize" value="'+esc(reward.prize)+'"><div class="actions"><button class="btn main" data-act="save-reward">Save Friday reward</button></div><p class="msg">Kaiya has '+weeklyStars(new Date())+' stars this week. The count resets automatically each Monday.</p></div>';
      h+='<div class="actions"><button class="btn main" data-act="add-task">Add task</button><button class="btn main" data-act="add-plan">Add calendar item</button>'
        +'<button class="btn" data-act="lock">Lock now</button><button class="btn" data-act="reset-today">Uncheck today</button><button class="btn" data-act="close">Close</button></div>';
    }
    if(sheetMsg)h+='<p class="msg">'+esc(sheetMsg)+'</p>';
    return h+'</div></div>';
  }
  function readForm(){
    if(!editing)return;
    var e=document.getElementById("f-emoji"),t=document.getElementById("f-title"),k=document.getElementById("f-kind"),dt=document.getElementById("f-date"),fw=document.getElementById("f-who"),ft=document.getElementById("f-type"),fs=document.getElementById("f-stars");
    if(e)editing.emoji=e.value.trim()||"⭐";
    if(t)editing.title=t.value;
    if(fw)editing.who=[fw.value];
    if(ft)editing.type=ft.value;
    if(fs)editing.stars=Math.max(1,parseInt(fs.value,10)||1);
    if(k){
      var kind=k.value, r=editing.repeat||{};
      if(kind!==r.kind){editing.repeat=kind==="days"?{kind:"days",days:[1,2,3,4,5]}:kind==="date"?{kind:"date",date:iso(viewDate())}:{kind:"daily"}}
    }
    if(dt&&editing.repeat.kind==="date")editing.repeat.date=dt.value;
  }
  function toggle(arr,v){var i=arr.indexOf(v);if(i>-1)arr.splice(i,1);else arr.push(v);return arr}
  function publish(){
    if(!artifact)return Promise.resolve();
    var clone=document.documentElement.cloneNode(true);
    clone.querySelector("#fp-app").innerHTML="";
    clone.querySelector("body").setAttribute("data-mode","kid");
    clone.querySelector("#fp-data").textContent=JSON.stringify(state).replace(/</g,"\\u003c");
    return artifact.publish("<!doctype html>\n"+clone.outerHTML);
  }
  function saveEdit(){
    readForm();
    var it=editing;
    if(!it.title.trim()){sheetMsg="Please give it a name.";render();return}
    if(!(it.who||[]).length){sheetMsg="Pick at least one person.";render();return}
    if(it.repeat.kind==="days"&&!(it.repeat.days||[]).length){sheetMsg="Pick at least one day.";render();return}
    var isNew=it._new; delete it._new;
    if(artifact){
      if(isNew)state.items.push(it);
      else state.items=state.items.map(function(x){return x.id===it.id?it:x});
      sheetMsg="Saving…";render();
      publish().catch(function(err){sheetMsg="Could not save ("+((err&&err.code)||"error")+"). Try again.";render()});
    } else {
      var ai=-1;local.add.forEach(function(x,i){if(x.id===it.id)ai=i});
      if(ai>-1)local.add[ai]=it;
      else if(isNew)local.add.push(it);
      else local.edit[it.id]=it;
      save("fp-local",local);
      editing=null;sheetMsg="Saved on this device.";confirmDel=false;
      if(!editFromList){sheetOpen=false;sheetMsg=""}
      render();
    }
  }

  /* ---------- events ---------- */
  var holdTimer=null;
  app.addEventListener("pointerdown",function(ev){
    if(ev.target.closest&&ev.target.closest("#gear")){
      var g=document.getElementById("gear");g.classList.add("holding");
      holdTimer=setTimeout(function(){sheetOpen=true;editing=null;sheetMsg="";render()},1100);
    }
  });
  function cancelHold(){clearTimeout(holdTimer);var g=document.getElementById("gear");if(g)g.classList.remove("holding")}
  app.addEventListener("pointerup",cancelHold);app.addEventListener("pointerleave",cancelHold);app.addEventListener("pointercancel",cancelHold);

  document.addEventListener("keydown",function(ev){
    if(unlocked)return;
    if(/^[0-9]$/.test(ev.key))pinKey(ev.key);else if(ev.key==="Backspace")pinKey("back");
  });
  app.addEventListener("click",function(ev){
    var t=ev.target;
    var pk=t.closest("[data-pin]");
    if(pk&&!unlocked){pinKey(pk.getAttribute("data-pin"));return}
    var sy=t.closest("[data-say]");
    if(sy){ev.stopPropagation();say(sy.getAttribute("data-say"));return}
    var au=t.closest("[data-audio]");
    if(au&&!au.hasAttribute("data-letter-choice")){ev.stopPropagation();playClip(au.getAttribute("data-audio"),au.getAttribute("data-fallback"));return}
    var aj=t.closest("[data-all-jobs]");
    if(aj&&!sheetOpen){showAllJobs=!showAllJobs;render();return}
    var p=t.closest("[data-who]");
    if(p){who=p.getAttribute("data-who");save("fp-who",who);offset=0;ciEdit=false;render();window.scrollTo(0,0);return}
    var nv=t.closest("[data-nav]");
    if(nv){var v=+nv.getAttribute("data-nav");offset=v===0?0:offset+v;render();return}
    var gt=t.closest("[data-goto]");
    if(gt){offset=+gt.getAttribute("data-goto");render();return}
    var ce=t.closest("[data-ciedit]");
    if(ce){ciEdit=ce.getAttribute("data-ciedit")==="1";render();return}
    var lt=t.closest("[data-letter-toggle]");
    if(lt&&!sheetOpen){lessonOpen=!lessonOpen;letterPick="";letterSubmitted=false;render();if(lessonOpen){var openLetter=dailyLetter(viewDate());playClip("audio/lessons/"+openLetter[0].toLowerCase()+".mp3",phonicsLine(openLetter)+" "+letterQuestion(openLetter))}return}
    var lc=t.closest("[data-letter-choice]");
    if(lc&&!sheetOpen){letterPick=lc.getAttribute("data-letter-choice");letterSubmitted=false;var pickedLetter=LETTERS.filter(function(x){return x[0]===letterPick})[0];playClip(lc.getAttribute("data-audio"),pickedLetter[1]+".");render();return}
    var ls=t.closest("[data-letter-submit]");
    if(ls&&!sheetOpen){var dl=dailyLetter(viewDate());if(!letterPick){playClip("audio/feedback/choose.mp3","Choose a picture first.");return}letterSubmitted=true;playClip(letterPick===dl[0]?"audio/feedback/correct.mp3":"audio/feedback/again.mp3",letterPick===dl[0]?"Yes! Great listening!":"Almost. Listen again, and try another picture.");render();return}
    var wo=t.closest("[data-workout]");
    if(wo&&!sheetOpen){var wk2=wo.getAttribute("data-workout");if(workoutDone[wk2])delete workoutDone[wk2];else workoutDone[wk2]=1;save("fp-workout",workoutDone);render();return}
    var discover=t.closest("[data-discover]");
    if(discover&&!sheetOpen){var dd=dailyDiscovery(viewDate());discovered[iso(viewDate())]=1;save("fp-discovered",discovered);render();playClip("audio/discoveries/"+dd.theme.key+"-"+dd.day+".mp3",dd.entry.fact+" "+dd.entry.try);return}
    var em=t.closest("[data-emo]");
    if(em&&!sheetOpen){
      var id=em.getAttribute("data-emo"),k1=iso(viewDate());
      checkins[k1]=checkins[k1]||{};checkins[k1].feel=id;save("fp-checkin",checkins);
      ciEdit=false;
      EMOTIONS.forEach(function(e){if(e[0]===id)say("I feel "+e[2])});
      render();return;
    }
    var gs=t.closest("[data-guess]");
    if(gs&&!sheetOpen){
      var idx=+gs.getAttribute("data-guess"),dv=viewDate(),k2=iso(dv);
      if(idx===dv.getDay()){checkins[k2]=checkins[k2]||{};checkins[k2].day=idx;save("fp-checkin",checkins);say("Today is "+DOWLONG[idx])}
      else{shakeIdx=idx;say("Try again")}
      render();return;
    }
    var tile=t.closest("[data-key]");
    if(tile&&!sheetOpen){
      var k=tile.getAttribute("data-key");
      if(done[k])delete done[k];else{done[k]=1;justDone=k}
      save("fp-done",done);render();queueCompletion(k,!!done[k]);return;
    }
    var cg=t.closest("[data-collapse]");
    if(cg&&!sheetOpen){
      var cs=cg.getAttribute("data-collapse");collapsed[cs]=!collapsed[cs];save("fp-collapsed",collapsed);render();return;
    }
    var f=t.closest("[data-f]");
    if(f&&editing){
      readForm();
      var fld=f.getAttribute("data-f"),val=f.getAttribute("data-v");
      if(fld==="who")toggle(editing.who=editing.who||[],val);
      if(fld==="type")editing.type=val;
      if(fld==="day")toggle(editing.repeat.days=editing.repeat.days||[],+val);
      if(fld==="slot"){editing.slots=editing.slots||[];toggle(editing.slots,val);editing.slots.sort(function(a,b){return slotRank(a)-slotRank(b)})}
      render();return;
    }
    var a=t.closest("[data-act]");
    if(a){
      var act=a.getAttribute("data-act");
      if(act==="close"){sheetOpen=false;editing=null;sheetMsg="";render()}
      else if(act==="add-task"||act==="add-plan"){editFromList=sheetOpen;sheetOpen=true;confirmDel=false;editing={_new:true,id:"i"+Date.now().toString(36),title:"",emoji:act==="add-plan"?"📅":"⭐",who:[who],type:act==="add-plan"?"plan":"task",stars:1,repeat:act==="add-plan"?{kind:"date",date:iso(viewDate())}:{kind:"daily"},slots:[]};sheetMsg="";render()}
      else if(act==="edit"){editFromList=sheetOpen;sheetOpen=true;confirmDel=false;var eid=a.getAttribute("data-id");editing=JSON.parse(JSON.stringify(items().filter(function(x){return x.id===eid})[0]));sheetMsg="";render()}
      else if(act==="lock"){sessionStorage.removeItem("fp-unlock");unlocked=false;sheetOpen=false;editing=null;pinEntry="";render()}
      else if(act==="save-reward"){
        var rg=Math.max(1,parseInt((document.getElementById("f-reward-goal").value||"20"),10)||20),rp=(document.getElementById("f-reward-prize").value||"").trim();
        reward.goal=rg;reward.prize=rp||"Choose a special treat!";save("fp-reward",reward);sheetMsg="Reward saved.";render();
      }
      else if(act==="cancel-edit"){editing=null;sheetMsg="";confirmDel=false;if(!editFromList)sheetOpen=false;render()}
      else if(act==="save")saveEdit();
      else if(act==="delete"){
        if(!confirmDel){readForm();confirmDel=true;render();return}
        confirmDel=false;var did=editing.id;
        if(artifact){state.items=state.items.filter(function(x){return x.id!==did});editing=null;sheetMsg="Saving…";render();publish().catch(function(){sheetMsg="Could not save. Try again.";render()})}
        else{
          var wasAdded=local.add.some(function(x){return x.id===did});
          local.add=local.add.filter(function(x){return x.id!==did});
          if(!wasAdded&&local.del.indexOf(did)<0)local.del.push(did);
          delete local.edit[did];save("fp-local",local);
          editing=null;sheetMsg="Deleted on this device.";if(!editFromList){sheetOpen=false;sheetMsg=""}render();
        }
      }
      else if(act==="reset-today"){var pre="d:"+iso(viewDate())+":";Object.keys(done).forEach(function(k3){if(k3.indexOf(pre)===0){delete done[k3];queueCompletion(k3,false)}});delete checkins[iso(viewDate())];save("fp-done",done);save("fp-checkin",checkins);sheetOpen=false;render()}
      return;
    }
    if(t.id==="sheet"){sheetOpen=false;editing=null;render()}
  });
  app.addEventListener("change",function(ev){
    if(editing&&(ev.target.id==="f-kind"||ev.target.id==="f-type")){readForm();render()}
  });

  var lastDay=iso(new Date());
  var lastSync=0;
  function syncAirtable(force){
    if(location.protocol==="file:")return Promise.resolve();
    if(!force&&Date.now()-lastSync<30000)return Promise.resolve();
    lastSync=Date.now();
    return fetch("/.netlify/functions/family-data",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status===503?"Airtable sync needs its secure token in Netlify.":"Airtable sync is unavailable right now.");return r.json()}).then(function(data){
      if(Array.isArray(data.items)){
        state.items=data.items;local.edit={};local.del=[];save("fp-local",local);
        if(Array.isArray(data.completions)){
          var remote={};data.completions.forEach(function(c){remote[c.key]=c.completed});
          if(!load("fp-completions-imported",false)){
            Object.keys(done).forEach(function(k){if(done[k]&&/^d:\d{4}-\d{2}-\d{2}:rec[A-Za-z0-9]+:/.test(k)&&!Object.prototype.hasOwnProperty.call(remote,k)&&state.items.some(function(it){return k.indexOf(":"+it.id+":")>-1})){completionPending[k]=true}});
            save("fp-completion-pending",completionPending);save("fp-completions-imported",true);
          }
          Object.keys(done).forEach(function(k){if(/^d:\d{4}-\d{2}-\d{2}:rec[A-Za-z0-9]+:/.test(k)&&!Object.prototype.hasOwnProperty.call(completionPending,k))delete done[k]});
          Object.keys(remote).forEach(function(k){if(!Object.prototype.hasOwnProperty.call(completionPending,k)&&remote[k])done[k]=1});
          save("fp-done",done);
          Object.keys(completionPending).forEach(function(k){if(!completionQueues[k])queueCompletion(k,completionPending[k])});
        }
        syncMessage="";if(!sheetOpen)render()
      }
    }).catch(function(err){syncMessage=err.message||"Airtable sync is unavailable right now.";if(!sheetOpen)render()});
  }
  function tick(){var dn=iso(new Date());if(dn!==lastDay){lastDay=dn;if(offset===0&&!sheetOpen)render()}syncAirtable(false)}
  setInterval(tick,60000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden){tick();syncAirtable(true)}});

  render();
  syncAirtable(true);

})();
</script>
</body>
